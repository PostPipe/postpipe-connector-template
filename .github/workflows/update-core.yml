name: Update Core Dependency

on:
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch: # Also allow running this manually just in case

jobs:
  update-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Update postpipe-core
        run: |
          # Updates the package in package.json to the latest version and modifies package-lock.json
          npm install @postpipe-official/connector-core@latest
        
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(deps): auto-update @postpipe-official/connector-core to latest" || echo "No changes to commit"
          git push origin main

